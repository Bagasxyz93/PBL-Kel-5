
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa | SI-IN</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body class="min-h-screen bg-[#f0f4ff] p-4 sm:p-6 lg:flex lg:items-center lg:justify-center lg:p-10">

    <main class="mx-auto grid w-full max-w-5xl overflow-hidden rounded-[24px] border border-[#e7edf8] bg-white shadow-[0_12px_40px_rgba(35,68,130,0.07)] lg:min-h-[540px] lg:grid-cols-2">

        <!-- PANEL KIRI -->
        <section class="relative flex flex-col items-center bg-gradient-to-br from-[#edf3ff] via-[#f5f8ff] to-[#e6efff] px-7 pb-7 pt-8 sm:px-10 lg:px-12 lg:py-9">

            <!-- Logo -->
            <div class="flex w-full items-center gap-2.5 self-start">
                <img
                    src="/assets/img/Logo.png"
                    alt="Logo SI-IN"
                    class="h-8 w-8 object-contain"
                >
                <span class="text-lg font-bold tracking-tight text-[#244493]">
                    SI-IN
                </span>
            </div>

            <!-- Judul -->
            <div class="mt-7 text-center sm:mt-8">
                <h1 class="text-3xl font-extrabold italic tracking-tight text-[#244493] sm:text-[34px]">
                    SI-IN
                </h1>

                <p class="mt-1 text-sm font-semibold text-[#34445f]">
                    Sistem Informasi Inkubasi
                </p>

                <p class="mx-auto mt-2 max-w-[260px] text-xs leading-[1.7] text-[#788ba9]">
                    Bersama Membangun Potensi, Menuju
                    <br class="hidden sm:block">
                    Masa Depan
                </p>
            </div>

            <!-- Ilustrasi dari Figma -->
            <div class="flex w-full flex-1 items-center justify-center py-5 lg:py-2">
                <img
                    src="/assets/img/ImageLogin.png"
                    alt="Ilustrasi siswa sedang belajar menggunakan laptop"
                    class="h-auto max-h-[225px] w-full max-w-[300px] object-contain sm:max-h-[245px]"
                >
            </div>

            <!-- Badge Portal -->
            <div class="rounded-full border border-[#dbe7ff] bg-[#edf4ff]/80 px-3 py-1 text-[10px] font-medium text-[#5284f8]">
                Portal Siswa Inkubasi
            </div>
        </section>

        <!-- PANEL KANAN -->
        <section class="flex flex-col justify-center bg-white px-7 py-10 sm:px-10 lg:px-12 lg:py-12">

            <div class="mx-auto w-full max-w-[400px]">

                <!-- Heading -->
                <header class="mb-6">
                    <h2 class="text-[25px] font-bold leading-tight tracking-tight text-[#29364b] sm:text-[28px]">
                        Selamat Datang!
                    </h2>

                    <p class="mt-1.5 text-[11px] leading-5 text-[#8291aa] sm:text-xs">
                        Masuk ke akun SI-IN Siswa untuk melanjutkan
                    </p>
                </header>

                <!-- Form Login -->
                <form id="loginForm" class="space-y-4" novalidate>

                    <!-- NISN / Email -->
                    <div>
                        <label for="identity" class="mb-1.5 block text-[11px] font-semibold text-[#46546b]">
                            NISN / Email Siswa
                        </label>

                        <div class="flex h-[42px] items-center gap-3 rounded-lg border border-[#e0e7f1] bg-white px-3 shadow-[0_1px_3px_rgba(20,40,80,0.03)] transition focus-within:border-[#3470f6] focus-within:ring-2 focus-within:ring-blue-100">
                            <svg class="h-3.5 w-3.5 shrink-0 text-[#91a2bd]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="10" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                                <circle cx="12" cy="15" r="1"/>
                            </svg>

                            <input
                                id="identity"
                                name="identity"
                                type="text"
                                autocomplete="username"
                                placeholder="Masukkan NISN atau email"
                                class="h-full min-w-0 flex-1 bg-transparent text-[11px] text-[#34445f] outline-none placeholder:text-[#a2afc3]"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="mb-1.5 block text-[11px] font-semibold text-[#46546b]">
                            Password
                        </label>

                        <div class="flex h-[42px] items-center gap-3 rounded-lg border border-[#e0e7f1] bg-white px-3 shadow-[0_1px_3px_rgba(20,40,80,0.03)] transition focus-within:border-[#3470f6] focus-within:ring-2 focus-within:ring-blue-100">
                            <svg class="h-3.5 w-3.5 shrink-0 text-[#91a2bd]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="10" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                                <circle cx="12" cy="15" r="1"/>
                            </svg>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Masukkan password"
                                class="h-full min-w-0 flex-1 bg-transparent text-[11px] text-[#34445f] outline-none placeholder:text-[#a2afc3]"
                                required
                            >

                            <button
                                id="togglePassword"
                                type="button"
                                class="shrink-0 text-[#91a2bd] transition hover:text-[#2864ed]"
                                aria-label="Tampilkan password"
                                aria-pressed="false"
                            >
                                <svg id="eyeIcon" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/>
                                    <circle cx="12" cy="12" r="2.5"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Ingat saya / Lupa password -->
                    <div class="flex items-center justify-between gap-3 pt-0.5">
                        <label class="flex cursor-pointer items-center gap-2 text-[11px] text-[#697a94]">
                            <input
                                id="remember"
                                name="remember"
                                type="checkbox"
                                class="h-3.5 w-3.5 rounded-sm border-[#cbd5e1] accent-[#2864ed]"
                            >
                            Ingat saya
                        </label>

                        <a
                            id="forgotPassword"
                            href="#"
                            class="text-[11px] font-medium text-[#2864ed] hover:text-[#1d4ed8]"
                        >
                            Lupa password?
                        </a>
                    </div>

                    <!-- Pesan -->
                    <div
                        id="formMessage"
                        role="status"
                        aria-live="polite"
                        class="hidden rounded-lg border px-3 py-2 text-xs"
                    ></div>

                    <!-- Tombol masuk -->
                    <button
                        type="submit"
                        class="flex h-[42px] w-full items-center justify-center rounded-lg bg-[#2864ed] text-xs font-semibold text-white shadow-[0_2px_4px_rgba(40,100,237,0.25)] transition hover:bg-[#2056d6] active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-blue-100"
                    >
                        Masuk
                    </button>
                </form>
            </div>

            <!-- Copyright -->
            <footer class="mt-10 text-center lg:mt-12">
                <p class="text-[10px] text-[#a1aec2]">
                    © 2025 SI-IN. Semua hak dilindungi.
                </p>
            </footer>
        </section>
    </main>

    <script type="module" src="/src/js/login.js"></script>
</body>
</html>
