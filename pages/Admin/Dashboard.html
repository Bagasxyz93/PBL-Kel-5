<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SI-IN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">SI-IN Admin Panel</h1>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-medium transition">
            Keluar
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-2">Selamat Datang, Admin!</h2>
            <p class="text-gray-600">Anda berhasil masuk ke halaman Dashboard Administrator Sistem Informasi Inkubasi.</p>
            
            <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
                    <h3 class="font-semibold text-blue-700">Total Pengguna</h3>
                    <p class="text-2xl font-bold text-blue-900 mt-2">--</p>
                </div>
                <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
                    <h3 class="font-semibold text-green-700">Program Aktif</h3>
                    <p class="text-2xl font-bold text-green-900 mt-2">--</p>
                </div>
                <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg">
                    <h3 class="font-semibold text-purple-700">Kehadiran Hari Ini</h3>
                    <p class="text-2xl font-bold text-purple-900 mt-2">--</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Logout Sederhana -->
    <script type="module">
        import { supabase } from "../../src/js/supabase.js";

        const logoutBtn = document.getElementById("logoutBtn");
        logoutBtn.addEventListener("click", async () => {
            localStorage.clear();
            window.location.href = "../../index.html";
        });
    </script>
</body>
</html>
