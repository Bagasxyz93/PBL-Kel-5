<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa | SI-IN</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body class="m-0 bg-[#f8fafc] font-sans text-slate-800 antialiased">
    <div class="flex min-h-screen w-full bg-[#f8fafc]">

        <!-- Sidebar Fixed / Sticky sampai bawah -->
        <div id="sidebar-container" class="sticky top-0 h-screen shrink-0"></div>

        <!-- Konten Utama -->
        <div class="flex min-h-screen min-w-0 flex-1 flex-col">

            <!-- Header -->
            <div id="header-container" class="sticky top-0 z-10 shrink-0"></div>

            <main class="flex-1 p-6 lg:p-8">

                <!-- Sapaan -->
                <section class="mb-6">
                    <h1 id="sapaan-siswa" class="text-2xl font-bold tracking-tight text-[#1e293b]">
                        Halo, Nezaruriancta!
                    </h1>
                    <p class="mt-1 text-sm font-medium text-slate-400">
                        Semangat Belajar &amp; Berproses di Inkubasi SI-IN!
                    </p>
                </section>

                <!-- Kartu Statistik -->
                <section id="statistik-container" class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4">
                </section>

                <!-- Section Aktivitas & Jadwal -->
                <section class="mt-6 grid grid-cols-1 items-stretch gap-6 xl:grid-cols-2">

                    <!-- Aktivitas Terbaru -->
                    <article class="flex min-w-0 flex-col justify-between rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
                        <div>
                            <div class="mb-5 flex items-center justify-between">
                                <h2 class="flex items-center gap-2.5 text-base font-bold text-slate-800">
                                    <span class="h-2.5 w-2.5 rounded-full bg-[#5865ff]"></span>
                                    Aktivitas Terbaru
                                </h2>
                                <span class="text-xs font-medium text-slate-400">Pekan Ini</span>
                            </div>

                            <div id="aktivitas-container" class="divide-y divide-slate-100"></div>
                        </div>

                        <a href="/pages/Siswa/Daily-report.html"
                           class="mt-6 pt-4 text-center text-xs font-semibold text-[#5865ff] hover:text-indigo-700 transition-colors">
                            Lihat Seluruh Riwayat Aktivitas <span aria-hidden="true">→</span>
                        </a>
                    </article>

                    <!-- Jadwal Hari Ini -->
                    <article class="flex min-w-0 flex-col justify-between rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
                        <div>
                            <div class="mb-5 flex items-center justify-between">
                                <h2 class="flex items-center gap-2.5 text-base font-bold text-slate-800">
                                    <span class="h-2.5 w-2.5 rounded-full bg-[#8b4dff]"></span>
                                    Jadwal Hari Ini
                                </h2>

                                <span id="tanggal-hari-ini"
                                      class="rounded-lg bg-[#f5f0ff] px-3 py-1 text-xs font-semibold text-[#8b4dff]">
                                </span>
                            </div>

                            <div id="jadwal-container" class="space-y-3.5"></div>
                        </div>

                        <div class="mt-6 flex flex-wrap items-center justify-between border-t border-slate-100 pt-4 text-xs font-medium text-slate-500">
                            <span class="flex items-center gap-1.5">
                                <svg class="h-4 w-4 text-[#5865ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                <span id="jumlah-jadwal">3 Sesi Terjadwal</span>
                            </span>

                            <span class="text-slate-700 font-semibold">
                                Lab SI-IN Terbuka hingga 17:30
                            </span>
                        </div>
                    </article>

                </section>
            </main>

            <!-- Footer -->
            <div id="footer-container" class="mt-auto shrink-0"></div>
        </div>
    </div>

    <script type="module" src="/src/js/components.js"></script>
</body>
</html>
