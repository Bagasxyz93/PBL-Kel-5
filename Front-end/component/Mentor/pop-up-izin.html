
<!-- Modal / Pop-up Detail Permohonan Izin Siswa -->
<div id="modal-izin" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">

    <div class="bg-white rounded-3xl w-full max-w-3xl p-6 shadow-2xl border border-slate-100 relative max-h-[90vh] overflow-y-auto">

        <!-- Tombol Tutup -->
        <button
            type="button"
            id="modal-close-btn"
            class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full bg-slate-50 hover:bg-slate-100 flex items-center justify-center font-bold text-lg transition"
        >
            &times;
        </button>

        <!-- Header Modal -->
        <div class="flex items-center gap-3 pb-4 border-b border-slate-100 mb-6">

            <div class="p-2.5 rounded-2xl bg-emerald-50 text-[#00b09b]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6M8 13h8M8 17h5"/>
                </svg>
            </div>

            <div>
                <h3 class="text-base font-extrabold text-slate-900">
                    Detail Pengajuan Izin Siswa
                </h3>

                <p class="text-xs text-slate-500">
                    ID Pengajuan:
                    <span id="modal-id-pengajuan" class="font-semibold text-slate-700">
                        -
                    </span>
                </p>
            </div>

        </div>

        <!-- Konten Utama Modal -->
        <div class="space-y-5">

            <!-- Identitas Siswa dan Status -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-200/70">

                <div class="flex items-center gap-3.5">

                    <div
                        class="w-12 h-12 rounded-2xl bg-indigo-600 text-white font-extrabold flex items-center justify-center text-sm tracking-wide shadow-sm"
                        id="modal-siswa-initial"
                    >
                        -
                    </div>

                    <div>

                        <div class="flex items-center gap-2">
                            <h4
                                class="font-bold text-slate-900 text-sm"
                                id="modal-siswa-nama"
                            >
                                -
                            </h4>

                            <span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-600 text-[10px] font-bold">
                                Siswa Inkubasi
                            </span>
                        </div>

                        <p class="text-[11px] text-slate-400 mt-0.5">
                            NISN:
                            <span id="modal-siswa-nis">-</span>
                        </p>

                        <p
                            class="text-xs text-slate-600 font-semibold"
                            id="modal-siswa-program"
                        >
                            -
                        </p>

                    </div>

                </div>

                <div class="space-y-1 text-left sm:text-right">

                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        Status Pengajuan
                    </span>

                    <div id="modal-status-badge">
                        <!-- Status diisi melalui JavaScript -->
                    </div>

                </div>

            </div>

            <!-- Informasi Tanggal -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">

                <!-- Tanggal Pengajuan -->
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/70 space-y-1">

                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        Tanggal Pengajuan
                    </span>

                    <p class="font-bold text-slate-800 flex items-center gap-1.5">

                        <svg class="w-4 h-4 text-[#00b09b]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>

                        <span id="modal-tgl-pengajuan">-</span>

                    </p>

                </div>

                <!-- Tanggal Izin -->
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/70 space-y-1">

                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        Tanggal Izin
                    </span>

                    <p class="font-bold text-slate-800 flex items-center gap-1.5">

                        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>

                        <span id="modal-tgl-izin">-</span>

                    </p>

                </div>

            </div>

            <!-- Alasan Izin -->
            <div class="space-y-1.5 text-xs">

                <label class="font-bold text-slate-700">
                    Alasan Izin Siswa
                </label>

                <div
                    class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/70 text-slate-700 font-medium"
                    id="modal-alasan-teks"
                >
                    -
                </div>

            </div>

            <!-- Bukti / Lampiran -->
            <div class="space-y-1.5 text-xs">

                <div class="flex items-center justify-between gap-2">

                    <label class="font-bold text-slate-700">
                        Bukti / Lampiran Dokumen Izin
                    </label>

                    <span
                        id="modal-lampiran-status"
                        class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full"
                    >
                        Memeriksa lampiran
                    </span>

                </div>

                <div class="p-3.5 rounded-xl border border-slate-200 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">

                    <div class="flex items-center gap-3 min-w-0">

                        <div
                            id="modal-lampiran-icon"
                            class="p-2.5 rounded-lg bg-slate-100 text-slate-500 font-bold text-xs shrink-0"
                        >
                            FILE
                        </div>

                        <div class="min-w-0">

                            <p
                                class="font-bold text-slate-900 truncate"
                                id="modal-lampiran-nama"
                            >
                                -
                            </p>

                            <p class="text-[10px] text-slate-400">
                                Dokumen bukti pengajuan izin siswa
                            </p>

                        </div>

                    </div>

                    <div class="flex items-center gap-2 shrink-0">

                        <button
                            type="button"
                            id="btn-lihat-bukti"
                            class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition disabled:opacity-40 disabled:cursor-not-allowed"
                        >
                            Lihat File
                        </button>

                        <button
                            type="button"
                            id="btn-download-bukti"
                            class="px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-[#00b09b] font-semibold text-xs transition disabled:opacity-40 disabled:cursor-not-allowed"
                        >
                            Unduh File
                        </button>

                    </div>

                </div>

            </div>

            <!-- Catatan Mentor -->
            <div class="space-y-1.5 text-xs">

                <div class="flex items-center justify-between gap-2">

                    <label class="font-bold text-slate-700">
                        Catatan Guru / Mentor
                    </label>

                    <span class="text-[10px] text-slate-400">
                        Opsional
                    </span>

                </div>

                <textarea
                    id="input-catatan-mentor"
                    rows="3"
                    placeholder="Masukkan catatan atau alasan persetujuan/penolakan..."
                    class="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:border-[#00b09b] transition text-slate-800 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed"
                ></textarea>

                <p class="text-[10px] text-slate-400">
                    Catatan hanya dapat diubah selama pengajuan masih menunggu verifikasi.
                </p>

            </div>

        </div>

        <!-- Tombol Aksi Footer -->
        <div class="pt-5 mt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3">

            <button
                type="button"
                id="modal-kembali-btn"
                class="px-5 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-semibold shadow-sm transition"
            >
                ← Kembali
            </button>

            <div class="flex items-center gap-3">

                <button
                    type="button"
                    id="btn-reject-modal"
                    class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl transition shadow-md shadow-rose-500/20 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    Tolak
                </button>

                <button
                    type="button"
                    id="btn-approve-modal"
                    class="px-5 py-2.5 bg-[#00b09b] hover:bg-[#009b88] text-white text-xs font-bold rounded-xl transition shadow-md shadow-emerald-500/20 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    Setujui
                </button>

            </div>

        </div>

    </div>

</div>
