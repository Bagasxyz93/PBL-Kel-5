<header id="header-wrapper" class="sticky top-0 z-30 flex h-20 items-center justify-between gap-4 border-b border-slate-100 bg-white/80 px-8 backdrop-blur-md shrink-0 transition-colors duration-300">
    <div class="flex items-center gap-5">
        <!-- Logo atau Judul Brand Opsional -->
        <span class="text-base font-bold text-slate-800 tracking-wide">Portal SI-IN</span>
    </div>

    <div class="flex items-center gap-5">
        <!-- Notifikasi (Ditambahkan id="btn-notifikasi") -->
        <button
            id="btn-notifikasi"
            type="button"
            aria-label="Notifikasi"
            class="relative flex h-10 w-10 items-center justify-center rounded-xl text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition-colors"
        >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
        </button>

        <!-- Profil Pengguna -->
        <div class="flex items-center gap-3 border-l border-slate-100 pl-5">
            <div class="text-right">
                <p id="header-user-name" class="text-sm font-bold text-slate-800">Pengguna</p>
                <p id="header-user-role-badge" class="text-xs font-semibold text-indigo-600">Portal SI-IN</p>
            </div>

            <div id="header-user-avatar" class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-[#5865ff] to-[#8050ff] text-xs font-bold text-white shadow-md">
                US
            </div>
        </div>
    </div>
</header>
