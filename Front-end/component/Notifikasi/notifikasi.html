
<div class="space-y-6">

    <!-- Header & Subtitle Halaman Notifikasi -->
    <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-slate-800">
                Notifikasi
            </h1>
            <p class="mt-0.5 text-xs text-slate-400">
                Daftar pemberitahuan aktivitas belajar dan laporan harian Anda.
            </p>
        </div>

        <!-- Tombol Tandai Semua Sudah Dibaca -->
        <button
            type="button"
            id="btn-mark-all-read"
            class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-700 transition"
        >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Tandai Semua Sudah Dibaca
        </button>
    </div>

    <!-- Filter Kategori Tabs -->
    <div class="flex flex-wrap items-center gap-2 border-b border-slate-100 pb-4">

        <!-- Semua -->
        <button
            type="button"
            class="notif-tab rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white shadow-sm transition"
            data-filter="semua"
        >
            Semua
            <span
                id="notif-count-semua"
                class="ml-1 rounded-full bg-white/20 px-1.5 py-0.5 text-[10px]"
            >0</span>
        </button>

        <!-- Belum Dibaca -->
        <button
            type="button"
            class="notif-tab rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 transition"
            data-filter="belum-dibaca"
        >
            Belum Dibaca
            <span
                id="notif-count-belum-dibaca"
                class="ml-1 rounded-full bg-indigo-50 px-1.5 py-0.5 text-[10px] text-indigo-600 font-bold"
            >0</span>
        </button>

        <!-- Laporan Harian -->
        <button
            type="button"
            class="notif-tab rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 transition"
            data-filter="laporan"
        >
            Laporan Harian
        </button>

        <!-- Materi -->
        <button
            type="button"
            class="notif-tab rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 transition"
            data-filter="materi"
        >
            Materi
        </button>

        <!-- Akun -->
        <button
            type="button"
            class="notif-tab rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 transition"
            data-filter="akun"
        >
            Akun
        </button>

        <!-- Izin -->
        <button
            type="button"
            class="notif-tab rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 transition"
            data-filter="izin"
        >
            Izin
        </button>

    </div>

    <!-- Container Daftar Item Notifikasi -->
    <!-- Data akan dimasukkan melalui component.js dari API PHP -->
    <div
        class="space-y-3"
        id="notifikasi-list-container"
    >

        <!-- Tampilan awal sebelum data dimuat -->
        <div class="rounded-2xl border border-slate-100 bg-white p-8 text-center shadow-sm">
            <div class="flex justify-center mb-3">
                <svg
                    class="h-10 w-10 text-slate-300"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                </svg>
            </div>

            <p class="text-sm font-semibold text-slate-600">
                Memuat notifikasi...
            </p>

            <p class="mt-1 text-xs text-slate-400">
                Mohon tunggu sebentar.
            </p>
        </div>

    </div>

    <!-- Paginasi Footer -->
    <div
        id="notifikasi-pagination"
        class="flex items-center justify-between pt-2"
    >

        <p class="text-xs text-slate-400">
            Halaman
            <span
                id="notif-current-page"
                class="font-bold text-slate-700"
            >1</span>

            dari

            <span
                id="notif-total-page"
                class="font-bold text-slate-700"
            >1</span>
        </p>

        <div class="flex items-center gap-2">

            <!-- Tombol Sebelumnya -->
            <button
                type="button"
                id="btn-notif-prev"
                disabled
                class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2 text-xs font-semibold text-slate-400 cursor-not-allowed"
            >
                Sebelumnya
            </button>

            <!-- Tombol Selanjutnya -->
            <button
                type="button"
                id="btn-notif-next"
                disabled
                class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2 text-xs font-semibold text-slate-400 cursor-not-allowed"
            >
                Selanjutnya
            </button>

        </div>
    </div>

</div>
