<div class="space-y-6">
    <!-- Breadcrumb & Judul Sesuai Figma -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-400 tracking-wider mb-1 uppercase">
                <span>SI-IN</span>
                <span>/</span>
                <span>Kelola Program</span>
                <span>/</span>
                <span class="text-indigo-600">Tambah Program Baru</span>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Tambah Program</h1>
            <p class="text-xs text-slate-500 mt-0.5">Program Kelas Inkubasi</p>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="btnKembaliProgram" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
                <span>&larr; Kembali ke Daftar</span>
            </button>
            <button id="btnResetProgram" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
                <span>&#8635; Reset</span>
            </button>
        </div>
    </div>

    <!-- Form Utama Sesuai Figma -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden pb-12">
        <!-- Banner Gradien Atas Form -->
        <div class="h-2 w-full bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-400"></div>

        <form id="formTambahProgram" class="p-8 space-y-6 max-w-4xl mx-auto">
            
            <!-- Header Kartu Form -->
            <div class="flex items-center gap-3 pb-4 border-b border-slate-100">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-sm">Program Kelas Inkubasi</h3>
                    <p class="text-[11px] text-slate-400">Tambah Program majukan generasi</p>
                </div>
            </div>

            <!-- Input Nama Program -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Nama Program <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </span>
                    <input type="text" id="namaProgram" required placeholder="Program" class="w-full rounded-xl border border-slate-200 bg-slate-50/50 py-3 pl-10 pr-4 text-xs font-medium text-slate-700 placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/10 transition">
                </div>
                <p class="text-[10px] text-slate-400 mt-1">Gunakan nama yang jelas</p>
            </div>

            <!-- Input Deskripsi Program -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Deskripsi Program <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute top-3 left-3.5 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M7 7h10M7 12h10M7 17h6"/></svg>
                    </span>
                    <textarea id="deskripsiProgram" rows="3" required placeholder="Deskripsi" class="w-full rounded-xl border border-slate-200 bg-slate-50/50 py-3 pl-10 pr-4 text-xs font-medium text-slate-700 placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/10 transition resize-none"></textarea>
                </div>
            </div>

            <!-- Tombol Aksi Bawah Form -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <button id="btnBatalProgram" type="button" class="px-6 py-2.5 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl text-xs font-semibold shadow-sm transition">
                    Batal
                </button>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-blue-600/20 transition flex items-center gap-2" style="background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%) !important;">
                    Simpan Data Program
                </button>
            </div>
        </form>
    </div>
</div>
