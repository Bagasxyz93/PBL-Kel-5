<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mentor - SI-IN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f4f7fe] m-0 p-0 text-slate-800 h-screen overflow-hidden">

    <!-- Wrapper Utama Aplikasi -->
    <div id="app" class="flex h-screen w-screen overflow-hidden invisible opacity-0 transition-opacity duration-300">

        <!-- CONTAINER SIDEBAR -->
        <div id="sidebar-container" class="shrink-0 h-full"></div>

        <!-- Area Konten Utama -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto relative">
            
            <!-- HEADER CONTAINER -->
            <div id="header-container" class="sticky top-0 z-30 shrink-0"></div>

            <!-- KONTEN PROFIL MENTOR -->
            <main class="flex-1 p-8 max-w-4xl w-full mx-auto flex items-center justify-center">
                
                <!-- Card Utama Profil -->
                <div class="bg-white w-full rounded-3xl border border-slate-200 shadow-xl p-8 relative overflow-hidden">
                    
                    <!-- Header Card & Tahun Ajaran -->
                    <div class="flex items-center justify-between pb-6 border-b border-slate-100">
                        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">PROFIL SAYA</h2>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            Tahun Ajaran 2025/2026
                        </span>
                    </div>

                    <!-- Bagian Foto & Identitas Singkat -->
                    <div class="py-6 flex flex-col sm:flex-row items-center justify-between gap-6 border-b border-slate-100">
                        <div class="flex items-center gap-4">
                            <div class="relative">
                                <div class="h-20 w-20 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 text-2xl font-bold shadow-inner">
                                    <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </div>
                                <span class="absolute bottom-0 right-0 h-4 w-4 rounded-full bg-emerald-500 border-2 border-white"></span>
                            </div>
                            <div>
                                <h3 id="profile-name" class="text-lg font-extrabold text-slate-900">Bapak Bagaskara</h3>
                                <p class="text-xs text-slate-500 mt-0.5">
                                    <span class="font-semibold text-slate-700">STATUS</span> • <span class="text-[#00b09b] font-bold">NIP : 20000000</span>
                                </p>
                            </div>
                        </div>

                        <button id="btn-edit-profil" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700 shadow-sm transition">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            EDIT PROFIL
                        </button>
                    </div>

                    <!-- Informasi Akun Detail -->
                    <div class="pt-6 space-y-4">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Informasi Akun</h4>

                        <div class="grid grid-cols-1 divide-y divide-slate-100 text-xs">
                            <div class="py-3 flex items-center justify-between">
                                <span class="font-semibold text-slate-500">Email</span>
                                <span id="profile-email" class="font-bold text-slate-800">bagaskara@gmail.com</span>
                            </div>
                            <div class="py-3 flex items-center justify-between">
                                <span class="font-semibold text-slate-500">No. Telepon</span>
                                <span id="profile-phone" class="font-bold text-slate-800">081xxxx</span>
                            </div>
                            <div class="py-3 flex items-center justify-between">
                                <span class="font-semibold text-slate-500">Bidang Keahlian</span>
                                <span class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 font-bold text-[11px]">Website Dev</span>
                            </div>
                            <div class="py-3 flex items-center justify-between">
                                <span class="font-semibold text-slate-500">Status</span>
                                <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 font-bold text-[11px] uppercase tracking-wider">Aktif</span>
                            </div>
                        </div>
                    </div>

                </div>

            </main>

            <!-- FOOTER CONTAINER -->
            <div id="footer-container" class="shrink-0"></div>

        </div>
    </div>

    <!-- Panggil sistem komponen Anda -->
    <script type="module" src="/src/js/components.js"></script>
</body>
</html>
