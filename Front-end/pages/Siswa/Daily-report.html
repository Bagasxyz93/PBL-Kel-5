<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report Siswa | SI-IN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="m-0 bg-[#f8fafc] font-sans text-slate-800 antialiased h-screen overflow-hidden">
    <div
        id="app"
        class="flex h-screen w-screen overflow-hidden invisible opacity-0 transition-opacity duration-200"
        aria-busy="true"
    >
        <!-- Sidebar Fixed / Sticky -->
        <div id="sidebar-container" class="shrink-0 h-full"></div>

        <!-- Konten Utama -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto relative">

            <!-- Header -->
            <div id="header-container" class="sticky top-0 z-30 shrink-0"></div>

            <!-- Konten Utama Dinamis (SPA Container) -->
            <main id="main-content-area" class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
                <!-- Diisi otomatis oleh daily-report.js -->
            </main>

            <!-- Footer -->
            <div id="footer-container" class="mt-auto shrink-0"></div>
        </div>
    </div>

    <!-- Script Utama Komponen -->
    <script type="module" src="/src/js/components.js"></script>
</body>
</html>
