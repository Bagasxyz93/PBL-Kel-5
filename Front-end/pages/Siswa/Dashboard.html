<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa | SI-IN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-[#f8fafc] m-0 p-0 text-slate-800 h-screen overflow-hidden antialiased">
    <!-- Wrapper Utama Aplikasi -->
    <div
        id="app"
        class="flex h-screen w-screen overflow-hidden invisible opacity-0 transition-opacity duration-200"
        aria-busy="true">

        <!-- Sidebar Fixed / Sticky sampai bawah -->
        <div id="sidebar-container" class="shrink-0 h-full"></div>

        <!-- Konten Utama (Scrollable area) -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto relative">

            <!-- Header -->
            <div id="header-container" class="sticky top-0 z-30 shrink-0"></div>

            <main class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

                <!-- Sapaan -->
                <section>
                    <h1 id="sapaan-siswa" class="text-2xl font-bold tracking-tight text-[#1e293b]">
                        Halo, Nerazuriancta!
                    </h1>
                    <p class="mt-1 text-sm font-medium text-slate-400">
                        Semangat Belajar &amp; Berproses di Inkubasi SI-IN!
                    </p>
                </section>

                <!-- Kartu Statistik -->
                <section id="statistik-container" class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4">
                </section>

                <!-- Section Aktivitas Terbaru (Full 1 Kolom sesuai Figma) -->
                <section>
                    <article class="flex min-w-0 flex-col justify-between rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
                        <div>
                            <div class="mb-5 flex items-center justify-between">
                                <h2 class="flex items-center gap-2.5 text-base font-bold text-slate-800">
                                    <span class="h-2.5 w-2.5 rounded-full bg-[#5865ff]"></span>
                                    Aktivitas Terbaru
                                </h2>
                                <span class="text-xs font-medium text-slate-400">Pekan Ini</span>
                            </div>

                            <div id="aktivitas-container" class="divide-y divide-slate-100"></div>
                        </div>

                        <div class="mt-6 pt-4 text-center border-t border-slate-50">
                            <a href="/pages/Siswa/Daily-report.html"
                               class="text-xs font-semibold text-[#5865ff] hover:text-indigo-700 transition-colors inline-flex items-center gap-1">
                                Lihat Seluruh Riwayat Aktivitas <span aria-hidden="true">→</span>
                            </a>
                        </div>
                    </article>
                </section>
            </main>

            <!-- Footer -->
            <div id="footer-container" class="shrink-0"></div>
        </div>
    </div>

    <script type="module" src="/src/js/components.js"></script>
</body>
</html>
