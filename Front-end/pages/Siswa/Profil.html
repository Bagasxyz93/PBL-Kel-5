<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Siswa - SI-IN</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f4f7fe] m-0 p-0 text-slate-800 h-screen overflow-hidden">

    <!-- Wrapper Utama Aplikasi -->
    <div id="app" class="flex h-screen w-screen overflow-hidden invisible opacity-0 transition-opacity duration-300">

        <!-- Container Sidebar -->
        <div id="sidebar-container" class="shrink-0 h-full"></div>

        <!-- Area Konten Utama -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto relative">
            
            <!-- Header Container -->
            <div id="header-container" class="sticky top-0 z-30 shrink-0"></div>

            <!-- Konten Profil Siswa -->
            <main class="flex-1 p-8 max-w-4xl w-full mx-auto flex items-center justify-center">

                <!-- Card Utama Profil -->
                <div class="bg-white w-full rounded-3xl border border-slate-200 shadow-xl p-8 relative overflow-hidden">

                    <!-- Header Card -->
                    <div class="pb-6 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">
                                PROFIL SAYA
                            </h2>
                            <p class="text-xs text-slate-400 mt-1">
                                Informasi akun dan ringkasan aktivitas siswa
                            </p>
                        </div>
                        <span class="inline-flex items-center gap-2 rounded-full bg-indigo-50 px-3 py-1 text-xs font-bold text-indigo-600 border border-indigo-100">
                            <span class="h-2 w-2 rounded-full bg-indigo-600"></span>
                            Tahun Ajaran 2025/2026
                        </span>
                    </div>

                    <!-- Foto dan Identitas Siswa -->
                    <div class="py-6 flex flex-col sm:flex-row items-center justify-between gap-6 border-b border-slate-100">

                        <div class="flex items-center gap-4 w-full sm:w-auto">

                            <!-- Foto Profil -->
                            <div class="relative shrink-0">
                                <div class="h-20 w-20 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 text-2xl font-bold shadow-inner">
                                    <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </div>
                                <span class="absolute bottom-0 right-0 h-4 w-4 rounded-full bg-indigo-600 border-2 border-white flex items-center justify-center text-[9px] text-white font-bold">✓</span>
                            </div>

                            <!-- Identitas -->
                            <div class="min-w-0">
                                <h3 id="profil-nama" class="text-lg font-extrabold text-slate-900 truncate">
                                    NERAZURIANCTA
                                </h3>
                                <p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5 flex-wrap">
                                    <span class="font-bold text-slate-700">STATUS</span>
                                    <span>•</span>
                                    <span>NISN: <strong id="profil-nisn" class="text-indigo-600 font-bold">2000000000</strong></span>
                                </p>
                            </div>

                        </div>

                        <!-- Tombol Change Password (Memicu Pop-up) -->
                        <button id="btn-edit-profil" type="button"
                            class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700 shadow-sm transition shrink-0">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 4 1-4 9.5-9.5z"/>
                            </svg>
                            CHANGE PASSWORD
                        </button>

                    </div>

                    <!-- Informasi Akun -->
                    <div class="pt-6 space-y-4">

                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                            Informasi Akun
                        </h4>

                        <div class="grid grid-cols-1 divide-y divide-slate-100 text-xs">

                            <!-- Email -->
                            <div class="py-3 flex items-center justify-between gap-4">
                                <span class="font-semibold text-slate-500">Email</span>
                                <span id="profil-email" class="font-bold text-slate-800 break-all text-right">nerazaja@gmail.com</span>
                            </div>

                            <!-- Nomor Telepon -->
                            <div class="py-3 flex items-center justify-between gap-4">
                                <span class="font-semibold text-slate-500">No. Telepon</span>
                                <span id="profil-telepon" class="font-bold text-slate-800">081xxxx</span>
                            </div>

                            <!-- Program -->
                            <div class="py-3 flex items-center justify-between gap-4">
                                <span class="font-semibold text-slate-500">Program</span>
                                <span id="profil-program" class="px-3 py-1 rounded-md bg-slate-100 text-slate-700 font-bold text-[11px]">
                                    Website Dev
                                </span>
                            </div>

                            <!-- Status Akun -->
                            <div class="py-3 flex items-center justify-between gap-4">
                                <span class="font-semibold text-slate-500">Status</span>
                                <span id="profil-status" class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 font-bold text-[11px] uppercase tracking-wider">
                                    AKTIF
                                </span>
                            </div>

                        </div>
                    </div>

                </div>

            </main>

            <!-- Footer Container -->
            <div id="footer-container" class="shrink-0"></div>

        </div>
    </div>

    <!-- Container untuk memuat Modal Ubah Password secara Dinamis -->
    <div id="password-modal-container"></div>

    <!-- Sistem Komponen -->
    <script type="module" src="/src/js/components.js"></script>

</body>
</html>
