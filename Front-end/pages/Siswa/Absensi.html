<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Siswa | SI-IN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-[#f8fafc] m-0 p-0 text-slate-800 h-screen overflow-hidden antialiased">
    <div
    id="app"
    class="flex h-screen w-screen overflow-hidden invisible opacity-0 transition-opacity duration-200"
    aria-busy="true">

        <!-- Sidebar Fixed / Sticky -->
        <div id="sidebar-container" class="shrink-0 h-full"></div>

        <!-- Konten Utama -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto relative">

            <!-- Header -->
            <div id="header-container" class="sticky top-0 z-30 shrink-0"></div>

            <main class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

                <!-- Card Sesi Hari Ini -->
                <article class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
                    <div class="flex items-center justify-between pb-6">
                        <div class="flex items-center gap-2">
                            <h1 class="text-xl font-extrabold tracking-tight text-slate-800">
                                ABSEN
                            </h1>
                            <span class="text-xs font-semibold text-slate-400">• Sesi Hari Ini</span>
                        </div>

                        <!-- Badge Status -->
                        <span id="status-absen-badge" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500 px-4 py-1.5 text-xs font-bold text-white shadow-sm">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                            </svg>
                            HADIR
                        </span>
                    </div>

                    <!-- Grid Detail Sesi -->
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                        <div class="rounded-xl bg-slate-50/80 p-4 border border-slate-100">
                            <p class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">PROGRAM</p>
                            <p class="mt-1.5 text-xs font-bold text-slate-800">WEB DEVELOPMENT</p>
                        </div>

                        <div class="rounded-xl bg-slate-50/80 p-4 border border-slate-100">
                            <p class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">TANGGAL</p>
                            <p class="mt-1.5 text-xs font-bold text-slate-800" id="tanggal-absen-hari-ini">30/10/2026</p>
                        </div>

                        <div class="rounded-xl bg-slate-50/80 p-4 border border-slate-100">
                            <p class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">MENTOR</p>
                            <p class="mt-1.5 text-xs font-bold text-slate-800">BPK. RENDI KURNIAWAN, S.KOM</p>
                        </div>

                        <div class="rounded-xl bg-slate-50/80 p-4 border border-slate-100">
                            <p class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">JAM</p>
                            <p class="mt-1.5 text-xs font-bold text-slate-800">06.00 – 13.00 WIB</p>
                        </div>
                    </div>
                </article>

                <!-- Section Riwayat Absen -->
                <article class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
                    <h2 class="text-base font-extrabold tracking-tight text-slate-800 mb-6">
                        RIWAYAT ABSEN
                    </h2>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-slate-200 text-[11px] font-bold tracking-wider text-slate-400 uppercase">
                                    <th class="pb-3 pl-2">NAMA</th>
                                    <th class="pb-3">TANGGAL</th>
                                    <th class="pb-3">JAM MASUK</th>
                                    <th class="pb-3">JAM KELUAR</th>
                                    <th class="pb-3 text-right pr-2">STATUS</th>
                                </tr>
                            </thead>
                            <tbody id="riwayat-absen-container" class="divide-y divide-slate-100 font-medium">
                                <!-- Data di-render lewat JS -->
                            </tbody>
                        </table>
                    </div>
                </article>

            </main>

            <!-- Footer -->
            <div id="footer-container" class="shrink-0"></div>
        </div>
    </div>

    <script type="module" src="/src/js/components.js"></script>
</body>
</html>
