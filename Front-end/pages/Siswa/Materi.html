<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Siswa | SI-IN</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="m-0 bg-[#e9edf5] font-sans text-slate-800 antialiased h-screen overflow-hidden">

<!-- Aplikasi -->
<div
    id="app"
    class="invisible flex h-screen w-screen bg-[#e9edf5] opacity-0 transition-opacity duration-300 overflow-hidden"
    aria-busy="true"
>

    <!-- Sidebar -->
    <aside
        id="sidebar-container"
        class="sticky top-0 h-screen w-60 shrink-0"
    ></aside>

    <!-- Konten Utama -->
    <div class="flex h-full min-w-0 flex-1 flex-col overflow-y-auto">

        <!-- Header -->
        <header
            id="header-container"
            class="sticky top-0 z-20 shrink-0"
        ></header>

        <!-- Main -->
        <main class="flex-1 p-4 sm:p-5 lg:p-6 max-w-7xl w-full mx-auto">

            <!-- Judul Halaman -->
            <section class="mb-5">
                <h1 class="text-xl font-bold tracking-tight text-slate-800">
                    Materi Siswa
                </h1>
                <p class="mt-1 text-sm text-slate-500">
                    Pelajari materi dan tingkatkan kemampuanmu di kelas inkubasi.
                </p>
            </section>

            <!-- Container Materi -->
            <section
                class="rounded-[22px] border border-slate-200/80 bg-[#dce1e9] p-4 sm:p-5"
            >

                <!-- Header Section -->
                <div class="mb-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

                    <h2 class="flex items-center gap-2.5 text-base font-bold text-slate-800">
                        <span class="h-4 w-1.5 rounded-full bg-[#5865ff]"></span>
                        MATERI PEMBELAJARAN
                    </h2>

                    <!-- Pencarian Materi -->
                    <div class="relative w-full sm:w-56 lg:w-64">

                        <label for="search-materi" class="sr-only">
                            Cari materi
                        </label>

                        <input
                            type="search"
                            id="search-materi"
                            placeholder="CARI MATERI"
                            autocomplete="off"
                            class="h-9 w-full rounded-full border border-slate-200 bg-white px-4 pr-10 text-xs text-slate-700 outline-none transition focus:border-[#5865ff] focus:ring-2 focus:ring-indigo-100"
                        >

                        <svg
                            class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m16 16 4 4"></path>
                        </svg>

                    </div>
                </div>

                <!-- Area Daftar Materi -->
                <div class="min-h-40 rounded-2xl border border-slate-100 bg-white p-4 sm:p-5">

                    <!-- Kartu Materi akan dirender otomatis dengan ukuran sama rata via JS -->
                    <div
                        id="daftar-materi"
                        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-stretch w-full"
                    ></div>

                    <!-- Pesan jika materi tidak ditemukan -->
                    <div
                        id="materi-kosong"
                        class="hidden py-10 text-center"
                    >
                        <p class="text-sm font-semibold text-slate-600">
                            Materi tidak ditemukan.
                        </p>
                        <p class="mt-1 text-xs text-slate-400">
                            Coba gunakan kata kunci yang berbeda.
                        </p>
                    </div>

                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer
            id="footer-container"
            class="mt-auto shrink-0"
        ></footer>

    </div>
</div>

<!-- Container untuk memuat Modal Detail Materi secara Dinamis -->
<div id="materi-modal-container"></div>

<!-- Inisialisasi Layout & Komponen -->
<script type="module" src="/src/js/components.js"></script>

</body>
</html>
