<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Program - SI-IN Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="m-0 bg-[#f4f7fe] font-sans text-slate-800 antialiased h-screen overflow-hidden">

    <!-- Wrapper Utama Aplikasi -->
    <div id="app" class="flex h-screen w-screen overflow-hidden invisible opacity-0 transition-opacity duration-300" aria-busy="true">

        <!-- CONTAINER SIDEBAR -->
        <div id="sidebar-container" class="shrink-0 h-full"></div>

        <!-- Area Konten Utama -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto relative">
            
            <!-- HEADER CONTAINER -->
            <div id="header-container" class="sticky top-0 z-30 shrink-0"></div>

            <!-- KONTEN UTAMA (SPA Container: Tabel Program / Form Tambah Program) -->
            <main id="main-content-area" class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
                <!-- Konten dirender secara dinamis oleh admin-program.js -->
            </main>

            <!-- FOOTER CONTAINER -->
            <div id="footer-container" class="mt-auto shrink-0"></div>
        </div>
    </div>

    <!-- Panggil Skrip Komponen Global & Skrip Khusus Admin Program -->
    <script type="module" src="/src/js/components.js"></script>
    <script type="module" src="/src/js/Admin/admin-program.js"></script>
</body>
</html>
