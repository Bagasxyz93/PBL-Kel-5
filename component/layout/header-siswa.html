<header class="flex h-20 items-center justify-between gap-4 border-b border-slate-100 bg-white/80 px-8 backdrop-blur-md">
    <div class="w-full max-w-md">
        <div class="relative flex items-center">
            <svg class="absolute left-4 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input
                type="search"
                id="search-menu"
                placeholder="SEARCH MENU (CONTOH: ABSEN, TUGAS, JADWAL...)"
                class="w-full rounded-full border border-slate-100 bg-slate-50/80 py-2.5 pl-11 pr-4 text-[11px] font-semibold tracking-wider text-slate-600 uppercase placeholder:text-slate-400 focus:border-indigo-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all"
            >
        </div>
    </div>

    <div class="flex items-center gap-5">
        <!-- Notification Icon -->
        <button
            type="button"
            aria-label="Notifikasi"
            class="relative flex h-10 w-10 items-center justify-center rounded-xl text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition-colors"
        >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
        </button>

        <!-- User Profile -->
        <div class="flex items-center gap-3 border-l border-slate-100 pl-5">
            <div class="text-right">
                <p id="nama-siswa-header" class="text-sm font-bold text-slate-800">
                    Nezaruriancta
                </p>
                <p class="text-xs font-semibold text-indigo-600">Siswa Web Dev</p>
            </div>

            <div id="avatar-siswa"
                 class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-[#5865ff] to-[#8050ff] text-xs font-bold text-white shadow-md shadow-indigo-500/20">
                NR
            </div>
        </div>
    </div>
</header>
